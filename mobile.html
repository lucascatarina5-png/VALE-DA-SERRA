#app{display:none;min-height:100dvh;padding-bottom:96px}.app-top{background:linear-gradient(145deg,#075a3d,#0f754d);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 22px 64px;border-radius:0 0 42px 42px}.brand{font-size:31px;font-weight:950;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}.brand-cow{font-size:36px}.username{margin-top:7px;font-size:17px;letter-spacing:.4px;text-transform:uppercase}.welcome{margin:-42px 20px 20px;background:#fff;padding:25px 24px;border-radius:30px;box-shadow:var(--shadow)}.welcome h1{margin:0 0 8px;font-size:29px;color:#0b5138}.welcome p{margin:0;color:#737b77;font-size:18px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}.home-tile{min-height:166px;border:1px solid var(--line);border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#0d5138;font-weight:900;font-size:19px;text-align:center;box-shadow:0 7px 22px rgba(30,73,56,.05);padding:15px 8px}.home-tile:active,.nav-btn:active,.icon-btn:active{transform:scale(.975)}.tile-ico{width:80px;height:80px;border-radius:24px;background:#edf7f1;display:grid;place-items:center;font-size:48px}.home-tile.wide{grid-column:1/2}
.bottom-nav{position:fixed;z-index:100;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:76px;background:rgba(255,255,255,.98);border:1px solid #e1e6e2;border-radius:25px;box-shadow:0 12px 32px rgba(26,64,50,.17);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}.nav-btn{border:0;background:transparent;color:#5b6862;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:11px;min-width:0}.nav-btn .ni{font-size:26px;line-height:1}.nav-btn.active{background:#edf7f1;color:var(--green)}
.screen{display:none;min-height:calc(100dvh - 90px);padding:calc(12px + env(safe-area-inset-top,0px)) 14px 110px}.screen.active{display:block}.screen-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;position:sticky;top:0;background:rgba(246,243,232,.96);backdrop-filter:blur(8px);z-index:15;padding:8px 0}.back{width:46px;height:46px;border:0;border-radius:15px;background:#fff;border:1px solid var(--line);font-size:22px}.screen-title{font-size:23px;font-weight:950;color:#103f30;flex:1}.icon-btn{height:46px;min-width:46px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:0 13px;font-weight:900;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 18px rgba(24,67,51,.04);margin:10px 0}.search{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;padding:0 14px;font-size:16px;background:#fff}.section-label{font-size:13px;font-weight:900;color:#52655d;text-transform:uppercase;letter-spacing:.5px;margin:18px 3px 8px}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:15px;background:#edf7f1;display:grid;place-items:center;font-size:25px;flex:none}.row-main{min-width:0;flex:1}.row-main b{display:block;color:#153f31;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main small{display:block;color:#758078;margin-top:4px}.row-value{text-align:right;font-weight:900;color:#0c6041}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.ok{background:#e5f7eb;color:#0b7b38}.warn{background:#fff1d8;color:#a96500}.bad{background:#ffe4e2;color:#b42318}.empty{padding:30px 15px;text-align:center;color:#78817c}.loading{padding:22px;text-align:center;color:#65736c}.error{padding:13px;border-radius:15px;background:#fff0ef;color:#a92920;font-weight:700;margin:10px 0}
.form-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}.form-card .primary{margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px}.metric small{display:block;color:#6e7872;font-weight:700}.metric strong{display:block;margin-top:5px;font-size:22px;color:#104f38}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;min-width:0}.product-photo{aspect-ratio:1.25/1;border-radius:15px;background:#edf4ef;overflow:hidden;display:grid;place-items:center;font-size:40px}.product-photo img{width:100%;height:100%;object-fit:cover}.product-cat{font-size:11px;color:#6a7770;margin-top:9px}.product-name{font-size:14px;font-weight:900;color:#183f32;margin-top:3px;min-height:36px}.price{font-size:18px;font-weight:950;color:#0b58aa;margin-top:5px}.stock{font-size:11px;color:#66726b;margin-top:3px}.sell{width:100%;height:42px;border:0;border-radius:13px;background:#e8f7ed;color:#087436;font-weight:950;margin-top:9px}.cartbar{position:fixed;left:10px;right:10px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;background:#0d6a45;color:#fff;border:0;border-radius:18px;height:58px;font-weight:900;box-shadow:0 9px 24px rgba(13,106,69,.28)}.sheet{position:fixed;z-index:130;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end}.sheet.open{display:flex}.sheet-panel{width:100%;max-height:88dvh;background:#fff;border-radius:28px 28px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}.sheet-top{display:flex;align-items:center;gap:10px}.sheet-top h2{margin:0;flex:1}.close{border:0;background:#edf1ef;width:42px;height:42px;border-radius:14px;font-size:20px}.cartitem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #edf0ee}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:1px solid #dbe2de;background:#fff;border-radius:10px}.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.paybtn{height:50px;border:1px solid #dce4df;background:#fff;border-radius:15px;font-weight:900}.paybtn.sel{border-color:#0d6a45;background:#edf8f1;color:#075b3e}.totalbox{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:18px}.totalbox strong{font-size:26px;color:#0b5ba9}.finish{width:100%;height:58px;border:0;border-radius:17px;background:#12a64a;color:#fff;font-size:19px;font-weight:950}.cashbox{background:#fff8e7;border:1px solid #f0d495;border-radius:16px;padding:12px;margin:10px 0}.cashbox button{height:42px;border:0;border-radius:12px;background:#e6b11e;font-weight:900;padding:0 14px}.toast{position:fixed;z-index:999;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));padding:13px 15px;border-radius:15px;background:#123c30;color:#fff;font-weight:800;display:none;box-shadow:0 8px 25px rgba(0,0,0,.2)}.toast.show{display:block}.toast.err{background:#a82821}
@media(max-width:360px){.home-grid{gap:10px;padding:0 12px}.home-tile{min-height:145px;font-size:17px}.tile-ico{width:68px;height:68px;font-size:41px}.product-grid{gap:8px}.product{padding:8px}.product-name{font-size:13px}}
</style>
</head>
<body>
<div id="toast" class="toast" role="status"></div>
<section id="login">
 <div class="login-card"><div class="login-logo">🐄 Vale da Serra</div><div class="login-sub">Aplicativo Mobile</div>
  <form id="loginForm"><div class="field"><label>Usuário</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">Entrar</button><div id="loginMsg" class="msg"></div></form>
 </div>
</section>
<div id="app">
 <section id="homeScreen">
  <header class="app-top"><div class="brand"><span class="brand-cow">🐄</span><span>Vale da Serra</span></div><div class="username" id="homeUser">USUÁRIO</div></header>
  <div class="welcome"><h1 id="hello">Olá, USUÁRIO</h1><p>Escolha uma operação.</p></div>
  <main class="home-grid">
   <button class="home-tile" data-go="estoque"><span class="tile-ico">📦</span><span>Estoque / Galpão</span></button>
   <button class="home-tile" data-go="produtores"><span class="tile-ico">🧑‍🌾</span><span>Produtores</span></button>
   <button class="home-tile" data-go="entrada"><span class="tile-ico">🥛</span><span>Entrada de Leite</span></button>
   <button class="home-tile" data-go="historico"><span class="tile-ico">🧾</span><span>Histórico</span></button>
   <button class="home-tile wide" data-go="pdv"><span class="tile-ico">🛒</span><span>Loja / PDV</span></button>
  </main>
 </section>
 <section class="screen" id="screen-estoque"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Estoque / Galpão</div><button class="icon-btn" id="reloadStock">↻</button></div><input class="search" id="stockSearch" placeholder="Buscar produto"><div class="metric-grid"><div class="metric"><small>Produtos</small><strong id="stockCount">0</strong></div><div class="metric"><small>Itens</small><strong id="stockItems">0</strong></div></div><div id="stockList" class="product-grid"></div></section>
 <section class="screen" id="screen-produtores"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Produtores</div><button class="icon-btn" id="newProdBtn">＋</button></div><input class="search" id="prodSearch" placeholder="Buscar produtor"><div id="prodFormWrap" class="form-card hidden"><form id="prodForm"><div class="field"><label>Nome</label><input id="pNome" required></div><div class="field"><label>Localidade</label><input id="pLocal"></div><div class="field"><label>Tanqueiro</label><input id="pTanqueiro"></div><div class="field"><label>Caminhão</label><input id="pCaminhao"></div><button class="primary" type="submit">Salvar produtor</button></form></div><div id="prodList" class="list"></div></section>
 <section class="screen" id="screen-entrada"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Entrada de Leite</div></div><div class="form-card"><form id="entryForm"><div class="field"><label>Data</label><input id="eData" type="date" required></div><div class="field"><label>Produtor</label><select id="eProd" required></select></div><div class="field"><label>Quantidade (litros)</label><input id="eQtd" type="number" inputmode="decimal" min="0.01" step="0.01" required></div><button class="primary" type="submit">Registrar entrada</button></form></div><div class="section-label">Entradas recentes</div><div id="entryList" class="list"></div></section>
 <section class="screen" id="screen-historico"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Histórico</div><button class="icon-btn" id="reloadHistory">↻</button></div><div class="section-label">Leite</div><div id="histMilk" class="list"></div><div class="section-label">Vendas / Doações</div><div id="histSales" class="list"></div></section>
 <section class="screen" id="screen-pdv"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Loja / PDV</div><button class="icon-btn" id="reloadPdv">↻</button></div><input class="search" id="pdvSearch" placeholder="Buscar produto"><div id="cashStatus"></div><div id="pdvGrid" class="product-grid"></div><button id="cartBar" class="cartbar">🛒 Carrinho vazio</button></section>
 <section class="screen" id="screen-conta"><div class="screen-head"><button class="back" data-home>←</button><div class="screen-title">Conta</div></div><div class="card"><div class="avatar">👤</div><h2 id="accountName">Usuário</h2><p id="accountRole"></p><button class="primary" id="logoutBtn">Sair do aplicativo</button></div></section>
 <nav class="bottom-nav"><button class="nav-btn active" data-home><span class="ni">🏠</span><span>Início</span></button><button class="nav-btn" data-go="estoque"><span class="ni">📦</span><span>Estoque</span></button><button class="nav-btn" data-go="produtores"><span class="ni">🧑‍🌾</span><span>Produtores</span></button><button class="nav-btn" data-go="pdv"><span class="ni">🛒</span><span>PDV</span></button><button class="nav-btn" data-go="conta"><span class="ni">👤</span><span>Conta</span></button></nav>
</div>
<div class="sheet" id="cartSheet"><div class="sheet-panel"><div class="sheet-top"><h2>Venda atual</h2><button class="close" id="closeCart">×</button></div><div id="cartItems"></div><div class="totalbox"><span>TOTAL</span><strong id="cartTotal">R$ 0,00</strong></div><div class="field"><label>Cliente (opcional)</label><input id="customerName" placeholder="Nome do cliente"></div><div class="section-label">Forma de pagamento</div><div class="paygrid"><button class="paybtn sel" data-pay="dinheiro">💵 Dinheiro</button><button class="paybtn" data-pay="cartao">💳 Cartão</button><button class="paybtn" data-pay="pix">◆ PIX</button><button class="paybtn" data-pay="boleto">▧ Boleto</button><button class="paybtn" data-pay="doacao">🎁 Doação</button></div><button class="finish" id="finishSale">✓ Finalizar Venda</button></div></div>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const LS_TOKEN='vale_token', LS_USER='vale_user'; let token=localStorage.getItem(LS_TOKEN)||sessionStorage.getItem(LS_TOKEN)||''; let user={}; let state={produtores:[],lancamentos:[],pagamentos:[],debitos:[],pagamentosDebitos:[]}; let products=[],cart=new Map(),payment='dinheiro',photoCache=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} function num(n){return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2})}
function today(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day} function brDate(s){if(!s)return '-';const a=String(s).slice(0,10).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function toast(msg,err=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2800)}
function headers(json=false){const h={};if(token)h.Authorization='Bearer '+token;if(json)h['Content-Type']='application/json';return h}
async function api(url,opt={}){opt.headers={...headers(!!opt.body),...(opt.headers||{})};const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(_){j={ok:false,error:'Resposta inválida'}}if(r.status===401){logout(false);throw new Error('Sessão expirada. Entre novamente.')}if(!r.ok||j.ok===false)throw new Error(j.error||'Erro no servidor');return j}
function setUser(u){user=u||{};localStorage.setItem(LS_USER,JSON.stringify(user));const n=String(user.name||user.username||'USUÁRIO').trim().toUpperCase();$('#homeUser').textContent=n;$('#hello').textContent='Olá, '+n;$('#accountName').textContent=user.name||user.username||'Usuário';$('#accountRole').textContent='Nível: '+(user.role||'Usuário')}
function logout(call=true){const old=token;token='';localStorage.removeItem(LS_TOKEN);sessionStorage.removeItem(LS_TOKEN);localStorage.removeItem(LS_USER);$('#app').style.display='none';$('#login').style.display='grid';if(call&&old)fetch('/api/logout',{method:'POST',headers:{Authorization:'Bearer '+old}}).catch(()=>{})}
async function boot(){try{if(!token)throw new Error('');const me=await api('/api/me');setUser(me.user);$('#login').style.display='none';$('#app').style.display='block';await loadState();showHome()}catch(_){logout(false)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=$('#loginMsg');msg.textContent='Entrando...';try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})});token=j.token;localStorage.setItem(LS_TOKEN,token);sessionStorage.setItem(LS_TOKEN,token);setUser(j.user);msg.textContent='';$('#login').style.display='none';$('#app').style.display='block';await loadState();showHome()}catch(x){msg.textContent=x.message}});$('#logoutBtn').addEventListener('click',()=>logout(true));
async function loadState(){try{const j=await api('/api/state');if(j.data&&typeof j.data==='object')state={...state,...j.data};normalizeState();renderState()}catch(e){toast('Não foi possível carregar dados: '+e.message,true)}}
function normalizeState(){for(const k of ['produtores','lancamentos','pagamentos','debitos','pagamentosDebitos'])if(!Array.isArray(state[k]))state[k]=[]}
async function saveState(){normalizeState();await api('/api/state',{method:'PUT',body:JSON.stringify({data:state})})}
function producer(id){return state.produtores.find(p=>String(p.id)===String(id))} function entries(id){return state.lancamentos.filter(x=>String(x.prodId)===String(id))} function lastEntry(id){return entries(id).sort((a,b)=>String(a.data).localeCompare(String(b.data))).at(-1)}
function status(id){const l=lastEntry(id);if(!l)return 'Inativo';const days=Math.floor((new Date(today()+'T12:00:00')-new Date(l.data+'T12:00:00'))/86400000);return days>=10?'Inativo':'Ativo'}
function renderState(){renderProducers();renderEntries()}
function renderProducers(){const q=$('#prodSearch').value.trim().toLowerCase();const arr=state.produtores.filter(p=>!q||String(p.nome||'').toLowerCase().includes(q)||String(p.local||'').toLowerCase().includes(q));$('#prodList').innerHTML=arr.length?arr.sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(p=>`<div class="row"><div class="avatar">🧑‍🌾</div><div class="row-main"><b>${esc(p.nome)}</b><small>${esc(p.local||'Sem localidade')} • ${esc(p.tanqueiro||'Sem tanqueiro')}</small></div><span class="badge ${status(p.id)==='Ativo'?'ok':'bad'}">${status(p.id)}</span></div>`).join(''):'<div class="empty">Nenhum produtor encontrado.</div>';fillProducerSelect()}
function fillProducerSelect(){const cur=$('#eProd').value;$('#eProd').innerHTML='<option value="">Selecione...</option>'+state.produtores.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(p=>`<option value="${esc(p.id)}">${esc(p.nome)}</option>`).join('');if(cur)$('#eProd').value=cur}
function renderEntries(){const arr=state.lancamentos.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,80);$('#entryList').innerHTML=arr.length?arr.map(x=>{const p=producer(x.prodId);return `<div class="row"><div class="avatar">🥛</div><div class="row-main"><b>${esc(p?.nome||'Produtor')}</b><small>${brDate(x.data)} • ${esc(p?.local||'')}</small></div><div class="row-value">${num(x.qtd)} L</div></div>`}).join(''):'<div class="empty">Nenhuma entrada registrada.</div>';$('#histMilk').innerHTML=arr.slice(0,30).map(x=>{const p=producer(x.prodId);return `<div class="row"><div class="avatar">🥛</div><div class="row-main"><b>${esc(p?.nome||'Produtor')}</b><small>${brDate(x.data)}</small></div><div class="row-value">${num(x.qtd)} L</div></div>`}).join('')||'<div class="empty">Nenhuma entrada.</div>'}
$('#prodSearch').addEventListener('input',renderProducers);$('#newProdBtn').addEventListener('click',()=>$('#prodFormWrap').classList.toggle('hidden'));$('#prodForm').addEventListener('submit',async e=>{e.preventDefault();const p={id:crypto.randomUUID(),nome:$('#pNome').value.trim(),local:$('#pLocal').value.trim(),tanqueiro:$('#pTanqueiro').value.trim(),caminhao:$('#pCaminhao').value.trim()};state.produtores.push(p);try{await saveState();e.target.reset();$('#prodFormWrap').classList.add('hidden');renderState();toast('Produtor cadastrado.');fetch('/api/audit/event',{method:'POST',headers:headers(true),body:JSON.stringify({action:'PRODUTOR_CRIADO',details:{nome:p.nome,local:p.local}})}).catch(()=>{})}catch(x){state.produtores.pop();toast(x.message,true)}});
$('#eData').value=today();$('#entryForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('#eProd').value,q=Number($('#eQtd').value);if(!id||!(q>0))return;const x={id:crypto.randomUUID(),data:$('#eData').value,prodId:id,qtd:q};state.lancamentos.push(x);try{await saveState();$('#eQtd').value='';renderState();toast('Entrada registrada.');fetch('/api/audit/event',{method:'POST',headers:headers(true),body:JSON.stringify({action:'LEITE_ENTRADA_REGISTRADA',details:{produtor:producer(id)?.nome||'',qtd:q,data:x.data}})}).catch(()=>{})}catch(er){state.lancamentos.pop();toast(er.message,true)}});
async function loadProducts(){try{$('#stockList').innerHTML='<div class="loading">Carregando estoque...</div>';$('#pdvGrid').innerHTML='<div class="loading">Carregando produtos...</div>';const j=await api('/api/store/products?light=1');products=j.products||[];renderStock();renderPdv();loadVisiblePhotos()}catch(e){const m='<div class="error">'+esc(e.message)+'</div>';$('#stockList').innerHTML=m;$('#pdvGrid').innerHTML=m}}
function renderStock(){const q=$('#stockSearch').value.trim().toLowerCase(),arr=products.filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q));$('#stockCount').textContent=products.length;$('#stockItems').textContent=num(products.reduce((s,p)=>s+Number(p.stock||0),0));$('#stockList').innerHTML=arr.length?arr.map(productCard).join(''):'<div class="empty">Nenhum produto.</div>';loadVisiblePhotos()}
function productCard(p){return `<article class="product"><div class="product-photo" data-photo="${esc(p.id)}">🧀</div><div class="product-cat">${esc(p.category||'Produto')}</div><div class="product-name">${esc(p.name)}</div><div class="price">${money(p.sale_price)}</div><div class="stock">● ${num(p.stock)} ${esc(p.unit||'un')} disponíveis</div></article>`}
function renderPdv(){const q=$('#pdvSearch').value.trim().toLowerCase(),arr=products.filter(p=>!q||String(p.name||'').toLowerCase().includes(q)||String(p.category||'').toLowerCase().includes(q));$('#pdvGrid').innerHTML=arr.length?arr.map(p=>`<article class="product"><div class="product-photo" data-photo="${esc(p.id)}">🧀</div><div class="product-cat">${esc(p.category||'Produto')}</div><div class="product-name">${esc(p.name)}</div><div class="price">${money(p.sale_price)}</div><div class="stock">● ${num(p.stock)} ${esc(p.unit||'un')}</div><button class="sell" data-add="${esc(p.id)}">＋ Vender</button></article>`).join(''):'<div class="empty">Nenhum produto.</div>';$$('[data-add]').forEach(b=>b.addEventListener('click',()=>addCart(b.dataset.add)));loadVisiblePhotos()}
async function photo(id){if(photoCache.has(id))return photoCache.get(id);try{const j=await api('/api/store/products/'+encodeURIComponent(id)+'/photo');photoCache.set(id,j.photo||'');return j.photo||''}catch(_){photoCache.set(id,'');return ''}}
function loadVisiblePhotos(){$$('[data-photo]').forEach(async el=>{if(el.dataset.done)return;el.dataset.done='1';const src=await photo(el.dataset.photo);if(src&&el.isConnected)el.innerHTML='<img alt="Produto" src="'+src+'">'})}
$('#stockSearch').addEventListener('input',renderStock);$('#pdvSearch').addEventListener('input',renderPdv);$('#reloadStock').addEventListener('click',loadProducts);$('#reloadPdv').addEventListener('click',async()=>{await loadProducts();await loadCash()});
function addCart(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const cur=cart.get(id)||{p,q:0};if(cur.q>=Number(p.stock||0)){toast('Estoque insuficiente.',true);return}cur.q++;cart.set(id,cur);renderCart();toast('Adicionado ao carrinho.')}
function cartTotal(){return Array.from(cart.values()).reduce((s,x)=>s+x.q*Number(x.p.sale_price||0),0)} function renderCart(){const n=Array.from(cart.values()).reduce((s,x)=>s+x.q,0);$('#cartBar').textContent=n?'🛒 '+n+' item(ns) • '+money(payment==='doacao'?0:cartTotal()):'🛒 Carrinho vazio';$('#cartItems').innerHTML=cart.size?Array.from(cart.entries()).map(([id,x])=>`<div class="cartitem"><div><b>${esc(x.p.name)}</b><div class="qty"><button data-minus="${esc(id)}">−</button><strong>${x.q}</strong><button data-plus="${esc(id)}">＋</button></div></div><strong>${payment==='doacao'?money(0):money(x.q*Number(x.p.sale_price||0))}</strong></div>`).join(''):'<div class="empty">Seu carrinho está vazio.</div>';$('#cartTotal').textContent=payment==='doacao'?money(0):money(cartTotal());$$('[data-minus]').forEach(b=>b.onclick=()=>{const x=cart.get(b.dataset.minus);if(!x)return;if(--x.q<=0)cart.delete(b.dataset.minus);renderCart()});$$('[data-plus]').forEach(b=>b.onclick=()=>addCart(b.dataset.plus))}
$('#cartBar').addEventListener('click',()=>$('#cartSheet').classList.add('open'));$('#closeCart').addEventListener('click',()=>$('#cartSheet').classList.remove('open'));$('#cartSheet').addEventListener('click',e=>{if(e.target.id==='cartSheet')e.currentTarget.classList.remove('open')});$$('[data-pay]').forEach(b=>b.addEventListener('click',()=>{payment=b.dataset.pay;$$('[data-pay]').forEach(x=>x.classList.toggle('sel',x===b));renderCart()}));
async function loadCash(){try{const j=await api('/api/store/cash/status');if(j.session){$('#cashStatus').innerHTML='<div class="cashbox">🟢 Caixa aberto • Esperado em dinheiro: <b>'+money(j.session.expected_cash)+'</b></div>'}else{$('#cashStatus').innerHTML='<div class="cashbox">🟠 Caixa fechado. <button id="openCash">Abrir caixa</button></div>';$('#openCash').onclick=openCash}}catch(e){$('#cashStatus').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function openCash(){let v=prompt('Valor inicial do caixa:','0,00');if(v===null)return;v=Number(String(v).replace('.','').replace(',','.'))||0;try{await api('/api/store/cash/open',{method:'POST',body:JSON.stringify({opening_amount:v,note:'Aberto pelo App Mobile'})});toast('Caixa aberto.');loadCash()}catch(e){toast(e.message,true)}}
$('#finishSale').addEventListener('click',async()=>{if(!cart.size){toast('Adicione produtos.',true);return}const items=Array.from(cart.values()).map(x=>({product_id:x.p.id,quantity:x.q,unit_price:payment==='doacao'?0:Number(x.p.sale_price||0)}));try{const j=await api('/api/store/sales',{method:'POST',body:JSON.stringify({items,payment_method:payment,customer_name:$('#customerName').value.trim()})});toast(payment==='doacao'?'Doação registrada.':'Venda finalizada: '+money(j.total));cart.clear();renderCart();$('#cartSheet').classList.remove('open');await Promise.all([loadProducts(),loadCash(),loadHistory()])}catch(e){toast(e.message,true)}});
async function loadHistory(){renderEntries();try{const j=await api('/api/store/sales?days=30');const arr=j.sales||[];$('#histSales').innerHTML=arr.length?arr.slice(0,80).map(s=>`<div class="row"><div class="avatar">${s.payment_method==='doacao'?'🎁':'🛒'}</div><div class="row-main"><b>${s.payment_method==='doacao'?'Doação':'Venda'} • ${esc(s.customer_name||'Cliente balcão')}</b><small>${new Date(s.created_at).toLocaleString('pt-BR')} • ${esc(s.payment_method||'')}</small></div><div class="row-value">${money(s.total)}</div></div>`).join(''):'<div class="empty">Nenhuma venda.</div>'}catch(e){$('#histSales').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('#reloadHistory').addEventListener('click',loadHistory);
function showHome(){ $$('.screen').forEach(s=>s.classList.remove('active'));$('#homeScreen').style.display='block';$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.hasAttribute('data-home')));window.scrollTo(0,0)}
async function go(name){$('#homeScreen').style.display='none';$$('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+name));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.go===name));window.scrollTo(0,0);if(name==='estoque')await loadProducts();if(name==='produtores')renderProducers();if(name==='entrada')renderEntries();if(name==='historico')await loadHistory();if(name==='pdv')await Promise.all([loadProducts(),loadCash()])}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$$('[data-home]').forEach(b=>b.addEventListener('click',showHome));
boot();
})();
</script>
</body></html>
